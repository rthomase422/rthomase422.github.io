- title: Projects
  type: time_table
  contents:
    - title: Zero-Knowledge Social Proofs
      institution: Department of Computer Science, University of Maryland, College Park
      year: 2025 - Present
      description:
        - Designed a privacy-preserving proof-of-personhood framework using zero-knowledge proofs to achieve Sybil resistance and unlinkable identity verification without revealing user attributes.
        - Leveraged zkTLS-based attestations and exploring OPRF- and VDF-based constructions to enable secure account ownership proofs, deduplication, and abuse resistance under adversarial conditions.
    - title: "A Cryptographic Perspective on California's DROP"
      institution: Department of Computer Science, University of Maryland, College Park
      year: 2025 - Present
      description:
        - Conducted a cryptographic analysis of California's Delete Request and Opt-out Platform (DROP), identifying opportunities to strengthen privacy, accountability, and verifiable processing guarantees for statewide data deletion requests.
        - Designed and evaluated privacy-preserving protocol enhancements using Private Set Intersection (PSI), zero-knowledge proofs, and authenticated commitments to improve the security and auditability of large-scale data deletion workflows.
    - title: "Cryptographic Personas: Responsible Pseudonyms without De-Anonymization"
      institution: Department of Computer Science, University of Maryland, College Park
      year: 2024 - Present
      description:
        - Developed cryptographic personas, a privacy-preserving messaging framework enabling unlinkable pseudonymous identities with policy-based, revocable anonymity for moderation without requiring de-anonymization.
        - Optimized efficiency via offline zero-knowledge proof generation and folding techniques, and integrated prototype deployments with messaging platforms (Signal, Slack) for end-to-end evaluation in real-time settings.
    - title: Side-Channel Analysis of Microsoft Edge Password Leak Detection Protocol
      institution: Department of Computer Science, University of North Carolina at Chapel Hill
      year: 2023 - 2024
      description:
        - "Analyzed side-channel leakage in Microsoft Edge's Password Leak Detection pipeline and Microsoft SEAL homomorphic encryption library, identifying information leakage vectors under realistic adversarial assumptions."
        - Developed and evaluated practical attack methodologies across native and browser-based environments, constructing threat models to assess protocol robustness against timing and microarchitectural leakage.
    - title: "CheckOut: User-Controlled Anonymization for Customer Loyalty Programs"
      institution: Department of Computer Science, University of North Carolina at Chapel Hill
      year: 2022 - 2024
      description:
        - Designed and implemented CheckOut, a privacy-preserving loyalty system enabling unlinkable transaction authorization via user-controlled pseudonymization of loyalty identifiers, preventing cross-merchant tracking.
        - Developed a cryptographic protocol and mobile prototype leveraging randomized barcode representations and lightweight client-side transformations to enforce selective disclosure of loyalty credentials while preserving reward correctness and auditability.

